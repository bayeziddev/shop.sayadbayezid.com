# Cloudflare Worker: storefront + admin assets + /api/*.
# Replace the REPLACE_ME ids with the values printed by `wrangler d1 create` / `wrangler kv namespace create`
# (see docs/SPEC.md §17). These ids are not secrets.
name = "shop-sayadbayezid"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [{ pattern = "shop.sayadbayezid.com", custom_domain = true }]

[assets]
directory = "../dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[vars]
SITE_URL = "https://shop.sayadbayezid.com"
APP_ENV = "production"
# Keep "sandbox" until SSLCommerz live credentials are in place. In sandbox NO Purchase event is ever sent.
PAYMENT_MODE = "sandbox"
META_PIXEL_ID = "1469319801771203"
META_GRAPH_VERSION = "v21.0"

[[d1_databases]]
binding = "DB"
database_name = "shop-sayadbayezid-db"
database_id = "REPLACE_ME_D1_DATABASE_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_ME_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "shop-sayadbayezid-media"

[ai]
binding = "AI"

# Browser Rendering → real PDF invoices. Remove this block if your plan doesn't include it;
# invoices then fall back to a print-ready HTML page ("Save as PDF").
[browser]
binding = "BROWSER"

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true

# ---------------- Staging (sandbox payments, no tracking) ----------------
[env.staging]
name = "shop-sayadbayezid-staging"
workers_dev = true
routes = []

[env.staging.vars]
SITE_URL = "https://shop-sayadbayezid-staging.workers.dev"
APP_ENV = "staging"
PAYMENT_MODE = "sandbox"
META_PIXEL_ID = ""
META_GRAPH_VERSION = "v21.0"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "shop-sayadbayezid-db-staging"
database_id = "REPLACE_ME_STAGING_D1_DATABASE_ID"
migrations_dir = "migrations"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "REPLACE_ME_STAGING_KV_NAMESPACE_ID"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "shop-sayadbayezid-media-staging"

[env.staging.ai]
binding = "AI"
