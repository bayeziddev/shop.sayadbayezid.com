name: Test, migrate & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Check Cloudflare configuration
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || grep -q "REPLACE_ME_D1_DATABASE_ID\|REPLACE_ME_KV_NAMESPACE_ID" worker/wrangler.toml; then
            echo "::warning::Deploy skipped: set CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets and replace the REPLACE_ME ids in worker/wrangler.toml (docs/SPEC.md §17)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Back up D1 before migrating
        if: steps.cfg.outputs.ready == 'true'
        run: npx wrangler d1 export DB --remote --config worker/wrangler.toml --output "d1-backup-${GITHUB_SHA}.sql"

      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          name: d1-backup-${{ github.sha }}
          path: d1-backup-*.sql
          retention-days: 30

      - name: Apply D1 migrations
        if: steps.cfg.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote --config worker/wrangler.toml

      - name: Sync Worker secrets (only those set in GitHub)
        if: steps.cfg.outputs.ready == 'true'
        env:
          ADMIN_SETUP_TOKEN: ${{ secrets.ADMIN_SETUP_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          # Existing repository secret holding the Meta Conversions API access token
          META_CAPI_TOKEN: ${{ secrets.META_CONVERSATION_API }}
          SSLCOMMERZ_STORE_ID: ${{ secrets.SSLCOMMERZ_STORE_ID }}
          SSLCOMMERZ_STORE_PASSWORD: ${{ secrets.SSLCOMMERZ_STORE_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
          SMS_API_URL: ${{ secrets.SMS_API_URL }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_SENDER_ID: ${{ secrets.SMS_SENDER_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE: ${{ secrets.WHATSAPP_TEMPLATE }}
        run: |
          node -e '
            const names = ["ADMIN_SETUP_TOKEN","SESSION_SECRET","DATA_ENCRYPTION_KEY","META_CAPI_TOKEN","SSLCOMMERZ_STORE_ID","SSLCOMMERZ_STORE_PASSWORD","STRIPE_SECRET_KEY","STRIPE_WEBHOOK_SECRET","GEMINI_API_KEY","OPENAI_API_KEY","RESEND_API_KEY","EMAIL_FROM","ADMIN_ALERT_EMAIL","SMS_API_URL","SMS_API_KEY","SMS_SENDER_ID","WHATSAPP_TOKEN","WHATSAPP_PHONE_NUMBER_ID","WHATSAPP_TEMPLATE"];
            const out = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync("secrets.json", JSON.stringify(out), { mode: 0o600 });
            console.log("syncing", Object.keys(out).length, "secrets:", Object.keys(out).join(", "));
          '
          if [ "$(cat secrets.json)" != "{}" ]; then npx wrangler secret bulk secrets.json --config worker/wrangler.toml; fi
          rm -f secrets.json

      - name: Deploy
        if: steps.cfg.outputs.ready == 'true'
        run: npx wrangler deploy --config worker/wrangler.toml
