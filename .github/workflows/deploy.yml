name: Deploy to Cloudflare Workers

# Creates everything on Cloudflare automatically (Worker, D1, KV, R2) and deploys.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and (optionally) CLOUDFLARE_ACCOUNT_ID.
# The live link appears in the run summary and under the repo's "Environments → production".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip the test job (emergency redeploy only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.setup.outputs.site_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Deploy skipped — add the CLOUDFLARE_API_TOKEN repository secret (see docs/DEPLOY.md, step 2)."
            echo "### ⏸ Deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the **CLOUDFLARE_API_TOKEN** secret, then re-run this workflow. Guide: \`docs/DEPLOY.md\`." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - if: steps.creds.outputs.ready == 'true'
        run: npm run build

      - name: Create / find Worker resources (D1, KV, R2) and write config
        id: setup
        if: steps.creds.outputs.ready == 'true'
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME || 'cwb-agency' }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          CUSTOM_DOMAIN_TAKEOVER: ${{ vars.CUSTOM_DOMAIN_TAKEOVER }}
          WORKERS_DEV_SUBDOMAIN: ${{ vars.WORKERS_DEV_SUBDOMAIN }}
          PAYMENT_MODE: ${{ vars.PAYMENT_MODE || 'sandbox' }}
          ENABLE_BROWSER_RENDERING: ${{ vars.ENABLE_BROWSER_RENDERING || 'false' }}
          META_PIXEL_ID: ${{ vars.META_PIXEL_ID || '1469319801771203' }}
        run: node scripts/cf-setup.mjs

      - name: Back up D1 before migrating
        if: steps.creds.outputs.ready == 'true'
        continue-on-error: true # the very first deploy has an empty database
        run: npx wrangler d1 export DB --remote --config worker/wrangler.deploy.toml --output "d1-backup-${GITHUB_SHA}.sql"

      - uses: actions/upload-artifact@v6
        if: steps.creds.outputs.ready == 'true'
        continue-on-error: true
        with:
          name: d1-backup-${{ github.sha }}
          path: d1-backup-*.sql
          if-no-files-found: ignore
          retention-days: 30

      - name: Apply D1 migrations
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote --config worker/wrangler.deploy.toml

      - name: Deploy Worker
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy --config worker/wrangler.deploy.toml

      - name: Sync Worker secrets
        if: steps.creds.outputs.ready == 'true'
        env:
          ADMIN_SETUP_TOKEN: ${{ secrets.ADMIN_SETUP_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          META_CAPI_TOKEN: ${{ secrets.META_CONVERSATION_API }} # existing repo secret → Worker secret
          SSLCOMMERZ_STORE_ID: ${{ secrets.SSLCOMMERZ_STORE_ID }}
          SSLCOMMERZ_STORE_PASSWORD: ${{ secrets.SSLCOMMERZ_STORE_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
          SMS_API_URL: ${{ secrets.SMS_API_URL }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_SENDER_ID: ${{ secrets.SMS_SENDER_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE: ${{ secrets.WHATSAPP_TEMPLATE }}
        run: |
          npx wrangler secret list --config worker/wrangler.deploy.toml --format json > existing-secrets.json 2>/dev/null || echo "[]" > existing-secrets.json
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const existing = new Set(JSON.parse(fs.readFileSync("existing-secrets.json", "utf8") || "[]").map((s) => s.name));
            const names = ["ADMIN_SETUP_TOKEN","SESSION_SECRET","DATA_ENCRYPTION_KEY","META_CAPI_TOKEN","SSLCOMMERZ_STORE_ID","SSLCOMMERZ_STORE_PASSWORD","STRIPE_SECRET_KEY","STRIPE_WEBHOOK_SECRET","GEMINI_API_KEY","OPENAI_API_KEY","RESEND_API_KEY","EMAIL_FROM","ADMIN_ALERT_EMAIL","SMS_API_URL","SMS_API_KEY","SMS_SENDER_ID","WHATSAPP_TOKEN","WHATSAPP_PHONE_NUMBER_ID","WHATSAPP_TEMPLATE"];
            const out = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            // The app cannot run without these two. If neither GitHub nor the Worker has them yet, generate them ONCE.
            // (They are never regenerated afterwards, so encrypted data stays readable.)
            const generated = [];
            if (!out.SESSION_SECRET && !existing.has("SESSION_SECRET")) { out.SESSION_SECRET = crypto.randomBytes(32).toString("hex"); generated.push("SESSION_SECRET"); }
            if (!out.DATA_ENCRYPTION_KEY && !existing.has("DATA_ENCRYPTION_KEY")) { out.DATA_ENCRYPTION_KEY = crypto.randomBytes(32).toString("base64"); generated.push("DATA_ENCRYPTION_KEY"); }
            fs.writeFileSync("secrets.json", JSON.stringify(out), { mode: 0o600 });
            console.log("Syncing secrets:", Object.keys(out).filter((k) => !generated.includes(k)).join(", ") || "(none from GitHub)");
            if (generated.length) console.log(`::warning::Generated ${generated.join(" and ")} on the Worker because no GitHub secret was set. To keep a copy you control, set your own as GitHub secrets BEFORE storing real client data.`);
            if (!process.env.ADMIN_SETUP_TOKEN && !existing.has("ADMIN_SETUP_TOKEN")) console.log("::warning::ADMIN_SETUP_TOKEN is not set — you cannot create the first admin account until you add it as a GitHub secret and re-run.");
          '
          if [ "$(cat secrets.json)" != "{}" ]; then npx wrangler secret bulk secrets.json --config worker/wrangler.deploy.toml; fi
          rm -f secrets.json existing-secrets.json

      - name: Smoke test
        if: steps.creds.outputs.ready == 'true'
        env:
          URL: ${{ steps.setup.outputs.workers_dev_url }}
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/healthz" || true)
            if [ "$code" = "200" ]; then echo "✓ $URL/healthz → 200"; exit 0; fi
            echo "waiting for $URL ($code)…"; sleep 5
          done
          echo "::error::$URL/healthz did not return 200"; exit 1

      - name: Live URLs
        if: steps.creds.outputs.ready == 'true'
        env:
          SITE: ${{ steps.setup.outputs.site_url }}
          DEV: ${{ steps.setup.outputs.workers_dev_url }}
          DOMAIN: ${{ steps.setup.outputs.custom_domain }}
          R2: ${{ steps.setup.outputs.r2 }}
        run: |
          {
            echo "## 🚀 Cwb Agency is live"
            echo ""
            echo "| | URL |"
            echo "|---|---|"
            echo "| Website (workers.dev) | $DEV |"
            if [ -n "$DOMAIN" ]; then for d in $(echo "$DOMAIN" | tr ',' ' '); do echo "| Website (custom domain) | https://$d |"; done; else echo "| Custom domain | not set yet — see docs/DEPLOY.md step 5 |"; fi
            echo "| Admin panel | $SITE/admin/ |"
            echo "| Health check | $DEV/healthz |"
            echo ""
            if [ "$R2" != "true" ]; then echo "> ⚠️ R2 file storage is off — enable R2 in the Cloudflare dashboard and re-run to allow image/file uploads."; fi
          } >> "$GITHUB_STEP_SUMMARY"
